# Scheduled sweep of expired transient durable state (REQ-OPS-010 / BAR-022).
#
# Invokes `chirp-server sweep` — the binary's sweep subcommand — rather than duplicating the
# DELETE predicates as raw SQL (REQ-DOM-014: all durable state crosses the one seam). The
# subcommand calls ChirpRepository::sweep_expired_transient_state() and exits 0; it applies
# migrations on connect, so it is safe to schedule independently of the server pod start order.
#
# The original psql-based implementation duplicated the three DELETE predicates from
# sweep_expired_transient_state() (postgres.rs) as raw SQL, creating a second source of truth
# for the sweep logic (issue #117). This manifest fixes that by delegating entirely to the Rust
# seam — the CronJob now carries no domain knowledge about which tables or predicates constitute
# a sweep.
#
# Schedule rationale: expiry is already honoured at read time (an expired session resolves as
# absent; an expired recovery token is rejected), so this sweep is storage RECLAMATION, not a
# correctness gate. The shortest window is the 24h recovery token; hourly keeps expired rows from
# lingering more than ~1h past expiry at negligible cost (three index-supported DELETEs —
# sessions_expires_at_idx / recovery_tokens_expires_at_idx exist in migration 0002).
#
# Root cause of 2026-11-03 failures (chirp-transient-sweep-29895480 — 0/1 completions):
# The CronJob ran 2 minutes before the chirp-server pod (re)started. At that point the
# durable migrations had not yet been applied, so psql reported "relation sessions does not
# exist". This was a start-order race, not a connectivity failure. The new implementation is
# immune to this race: `chirp-server sweep` calls PostgresRepository::connect() which applies
# migrations before executing the sweep, so it is safe to run before or after the server pod.
#
# NOTE: The image digest below is the current production image. It will be updated to the digest
# produced by CI after this PR is merged and the main-push image job publishes the new build.
# Until then, ArgoCD will apply this manifest but the sweep job will not run correctly (the old
# binary does not implement the sweep subcommand). The image digest update is the final step after
# the post-merge CI run completes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chirp-transient-sweep
  namespace: chirp
  labels:
    app.kubernetes.io/name: chirp-transient-sweep
    app.kubernetes.io/part-of: chirp
    app.kubernetes.io/component: retention-sweep
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "0 * * * *"            # hourly, on the hour
  timeZone: "Etc/UTC"             # cadence-based; UTC stated explicitly (no DST/wall-clock dependence)
  concurrencyPolicy: Forbid        # a sweep writes shared state; never overlap a slow run into itself
  startingDeadlineSeconds: 200     # run a just-missed schedule; also avoids the >100-missed-schedules stall
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3              # retry a transient DB/connection hiccup a few times, then surface failure
      activeDeadlineSeconds: 120   # a sweep is seconds of work; bound a hung run
      ttlSecondsAfterFinished: 3600 # reap finished Jobs/Pods after an hour rather than accumulating them
      template:
        metadata:
          labels:
            app.kubernetes.io/name: chirp-transient-sweep
            app.kubernetes.io/part-of: chirp
            app.kubernetes.io/component: retention-sweep
            app.kubernetes.io/managed-by: argocd
        spec:
          restartPolicy: Never
          # This job calls only the database; it never touches the Kubernetes API.
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 10
          # The chirp-server image is private; the same pull secret the server Deployment uses.
          imagePullSecrets:
            - name: ghcr-pull
          # restricted-PSA-compliant (the chirp namespace enforces `restricted`): run as a nonroot
          # uid, drop all caps, seccomp RuntimeDefault, no privilege escalation, read-only root fs.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              # Same digest-pinned chirp-server image the Deployment uses (10-deployment.yaml),
              # built --features postgres. The sweep subcommand calls
              # ChirpRepository::sweep_expired_transient_state() — the single Rust seam (REQ-DOM-014).
              # NOTE: update this digest after the post-merge CI run publishes the new image.
              image: ghcr.io/nousix-llc/chirp-server@sha256:adaa4c26c94d2bffab0342d3dc279eb2d8b42e835494c59385c4b731e246fd41
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/chirp-server"]
              args: ["sweep"]
              env:
                # The single connection string consumed by PostgresRepository::connect().
                # CHIRP_DATABASE_URL takes precedence over DATABASE_URL in the server crate.
                # Sourced from the same out-of-band Secret the chirp-server Deployment uses —
                # never committed to git. The URL must include sslmode=require (enforced by
                # the operator when populating the secret — consistent with #120 which closed
                # the plaintext-DB-password-in-transit finding).
                - name: CHIRP_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: chirp-db-credentials
                      key: CHIRP_DATABASE_URL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
