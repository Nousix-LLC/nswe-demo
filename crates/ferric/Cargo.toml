[package]
name = "ferric"
description = "A small client-side web-application framework in Rust, compiled to WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys.workspace = true
# The DOM runtime (src/dom.rs) renders into and patches real DOM and binds the full EventKind set.
# These features cover element/text/comment node creation and mutation, attributes, and all
# supported event kinds; the DOM layer may extend this list additively if it needs more.
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Text",
    "Comment",
    "CharacterData",
    "Event",
    "EventTarget",
    "InputEvent",
    "MouseEvent",
    # Added for the full EventKind set (SUBTASK_dom_events):
    "KeyboardEvent",
    "FocusEvent",
    "PointerEvent",
    "DragEvent",
    "TouchEvent",
    "ClipboardEvent",
    "AnimationEvent",
    "TransitionEvent",
    "console",
    "NodeList",
    "DomTokenList",
    "NamedNodeMap",
    "Attr",
] }

ferric-macros = { path = "../ferric-macros", version = "0.1" }

# Browser test harness — available to native-gated `wasm_bindgen_test` suites the layer spokes add.
[dev-dependencies]
wasm-bindgen-test.workspace = true
